spring:
  profiles:
    active:
      test
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true
  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
  datasource:
    url: jdbc:tc:postgresql:9.6.8:///test
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    show-sql: true
  main:
    allow-bean-definition-overriding: true
logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}
token:
  jwt:
    issuer: ${ISSUER}
    secret: ${SECRET}
    access-token-expiration: ${ACCESS_TOKEN_TIME}
    refresh-token-expiration: ${REFRESH_TOKEN_TIME}