spring:
  config:
    activate:
      on-profile: "test"
  datasource:
    url: ${TEST_DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    show-sql: true
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true
  cloud:
    aws:
      s3:

      credentials:
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
      region:
        static: ap-northeast-2

  server:
    url: ${SERVER_URL}

token:
  jwt:
    issuer: ${ISSUER}
    secret: ${SECRET}
    access-token-expiration: ${ACCESS_TOKEN_TIME}
    refresh-token-expiration: ${REFRESH_TOKEN_TIME}

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}