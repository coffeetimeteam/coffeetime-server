spring:
  profiles:
    active:
      local
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true
  datasource:
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}

token:
  jwt:
    issuer: ${ISSUER}
    secret: ${SECRET}
    access-token-expiration: ${ACCESS_TOKEN_TIME}
    refresh-token-expiration: ${REFRESH_TOKEN_TIME}