spring:
  profiles:
    group:
      dev: "dev"
      prod: "prod"
    include:
      - security
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true
  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
      region:
        static: ap-northeast-2
  server:
    url: ${SERVER_URL}

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}

