spring:
  profiles:
    group:
      prod: "prod"
      dev: "dev"
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true

  datasource:
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 2000
      validation-timeout: 5000
      pool-name: CoffeeTimeHikariPool
      data-source-properties:
        applicationName: CoffeeTimeHikariPool
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 250MB
      resolve-lazily: true

oci:
  object-storage:
    namespace: ${OCI_NAMESPACE}
    bucket: ${OCI_BUCKET}
    region: ${OCI_REGION}
    access-key: ${OCI_ACCESS_KEY}
    secret-key: ${OCI_SECRET_KEY}

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}

token:
  jwt:
    issuer: ${ISSUER}
    secret: ${SECRET}
    access-token-expiration: ${ACCESS_TOKEN_TIME}
    refresh-token-expiration: ${REFRESH_TOKEN_TIME}

server:
  forward-headers-strategy: framework