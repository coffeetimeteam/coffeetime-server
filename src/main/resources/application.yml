spring:
  group:
    prod: "prod"
    dev: "dev"
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**,public/**
    livereload:
      enabled: true
  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
      region:
        static: ap-northeast-2
  server:
    url: ${SERVER_URL}
  datasource:
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}

token:
  jwt:
    issuer: ${ISSUER}
    secret: ${SECRET}
    access-token-expiration: ${ACCESS_TOKEN_TIME}
    refresh-token-expiration: ${REFRESH_TOKEN_TIME}