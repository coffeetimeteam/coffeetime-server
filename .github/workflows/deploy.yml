name: Docker Compose Build and Deploy

on:
  push:
    branches: [ "fix-19" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push with Docker Compose
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t "${{ secrets.DOCKERHUB_USERNAME }}"/coffeetime --push .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/

            sudo rm -f .env
            sudo rm -f docker-compose.yml

            sudo touch .env
            echo "${{ secrets.ENV_VARS }}" | sudo tee .env > /dev/null

            sudo touch docker-compose.yml
            echo "${{ secrets.DOCKER_COMPOSE }}" | sudo tee docker-compose.yml > /dev/null

            sudo chmod 666 /var/run/docker.sock

            sudo docker rm -f $(docker ps -qa)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull changedan/coffeetime || exit 1  # Exit if pull fails
            docker-compose -f docker-compose.yml --env-file ./.env up -d || exit 1
            docker image prune -f
