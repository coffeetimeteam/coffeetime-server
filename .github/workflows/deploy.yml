name: Docker Build and Deploy

on:
  push:
    branches: [ "chore-47" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  docker-buildx-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true
          token: ${{ secrets.ACTION_RUNNER_TOKEN }}

      - name: install java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: gradle caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: assign grant gradlew
        run: chmod +x ./gradlew

      - name: bootJar with gradle
        run: |
          ./gradlew clean bootJar -x test | base64

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coffeetime:latest
          no-cache: true
  docker-pull-and-run:
    runs-on: [ self-hosted, oci ]
    if: ${{ needs.docker-buildx-and-push.result == 'success' }}
    needs: [ docker-buildx-and-push ]
    environment: prod
    steps:
      - name: start deploy
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUER: ${{ secrets.ISSUER }}
          SECRET: ${{ secrets.SECRET }}
          ACCESS_TOKEN_TIME: ${{ secrets.ACCESS_TOKEN_TIME }}
          REFRESH_TOKEN_TIME: ${{ secrets.REFRESH_TOKEN_TIME }}
        run: |
          DB_HOST="${DB_HOST}" \
          DB_USERNAME="${DB_USERNAME}" \
          DB_PASSWORD="${DB_PASSWORD}" \
          DISCORD_WEBHOOK="${DISCORD_WEBHOOK}" \
          ISSUER="${ISSUER}" \
          SECRET="${SECRET}" \
          ACCESS_TOKEN_TIME="${ACCESS_TOKEN_TIME}" \
          REFRESH_TOKEN_TIME="${REFRESH_TOKEN_TIME}" \
          sh /home/ubuntu/deploy.sh