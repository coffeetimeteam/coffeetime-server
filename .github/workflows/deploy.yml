name: Docker Compose Build and Deploy

on:
  push:
    branches: [ "fix-19" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub using CLI
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build with Docker Compose
        run: |
          docker-compose build --no-cache

      - name: Push Docker Image
        run: |
          docker-compose push "${{ secrets.DOCKERHUB_USERNAME }}"/coffeetime:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/

            sudo rm -f .env
            sudo rm -f docker-compose.yml

            sudo touch .env
            echo "${{ secrets.ENV_VARS }}" | sudo tee .env > /dev/null

            sudo touch docker-compose.yml
            echo "${{ secrets.DOCKER_COMPOSE }}" | sudo tee docker-compose.yml > /dev/null

            # Set correct permissions for Docker socket
            sudo chmod 666 /var/run/docker.sock

            # Log in to Docker Hub from EC2
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Remove any running Docker containers
            sudo docker rm -f $(docker ps -qa)

            # Pull the latest image from Docker Hub
            sudo docker pull "${{ secrets.DOCKERHUB_USERNAME }}"/coffeetime:latest || exit 1

            # Run containers using docker-compose
            sudo docker-compose -f docker-compose.yml --env-file ./.env up -d || exit 1

            # Clean up old Docker images
            sudo docker image prune -f