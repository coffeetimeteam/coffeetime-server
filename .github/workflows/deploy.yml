name: Docker Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feat-23
    paths:
      - "./**"
      - ".github/workflows/deploy.yml"
jobs:
  docker-buildx-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true
          token: ${{ secrets.ACTION_RUNNER_TOKEN }}

      - name: install java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: gradle caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: assign grant gradlew
        run: chmod +x ./gradlew

      - name: bootJar with gradle
        run: ./gradlew clean bootJar -x test

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coffeetime:latest
          build-args: --no-cache

  docker-pull-and-run:
    runs-on: [ self-hosted, deploy ]
    if: ${{ needs.docker-buildx-and-push.result == 'success' }}
    needs: [ docker-buildx-and-push ]
    steps:
      - name: start deploy
        run: |
          sh /home/ubuntu/deploy.sh
